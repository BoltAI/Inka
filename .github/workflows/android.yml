name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test, lint, and assemble release
        run: ./gradlew test lint assembleRelease
